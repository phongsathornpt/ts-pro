name: Void Argument Hotfix

on:
  push:
    branches:
      - test/reliability-runtime-stress

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/reliability-runtime-stress
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Materialize undefined call arguments
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              'internal/midend/irgen/calls.go',
              'internal/midend/irgen/constructors.go',
          ):
              path = Path(name)
              text = path.read_text()
              old = 'g.lowerExpr(arg)'
              if old not in text:
                  raise SystemExit(f'expected argument lowering pattern not found in {name}')
              path.write_text(text.replace(old, 'g.lowerCallArgument(arg)'))
          PY
          cat > internal/midend/irgen/call_arguments.go <<'EOF'
          package irgen

          import (
              "github.com/phongsathornpt/ts-pro/internal/core/ast"
              "github.com/phongsathornpt/ts-pro/internal/core/ir"
          )

          // lowerCallArgument materializes JavaScript undefined when a void
          // expression is used in argument value position. Internally, void
          // lowering returns nil after emitting its side effects; nil must
          // never escape into IR call operands.
          func (g *generator) lowerCallArgument(expr ast.Expr) ir.Operand {
              value := g.lowerExpr(expr)
              if value == nil {
                  return ir.ConstUndefined{}
              }
              return value
          }
          EOF
          gofmt -w internal/midend/irgen/calls.go internal/midend/irgen/constructors.go internal/midend/irgen/call_arguments.go
      - name: Validate fix
        env:
          GOTOOLCHAIN: local
        run: |
          CGO_ENABLED=0 go test ./internal/midend/irgen
          CGO_ENABLED=0 go test ./internal/midend/irgen -run=^$ -fuzz=^FuzzIRGen$ -fuzztime=30s
      - name: Commit fix
        run: |
          rm .github/workflows/void-arg-hotfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(irgen): materialize undefined call arguments"
          git push origin HEAD:test/reliability-runtime-stress
