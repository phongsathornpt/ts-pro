name: IRGen Fuzz Hotfix

on:
  push:
    branches:
      - test/reliability-ir-backend-fuzz

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/reliability-ir-backend-fuzz
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Patch console reference printing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/midend/irgen/builtins.go')
          text = path.read_text()
          old = '''\tunion := t.(*types.UnionType)\n\tvar concrete types.Type\n'''
          new = '''\tunion, ok := t.(*types.UnionType)\n\tif !ok {\n\t\tvalue := g.lowerExpr(expr)\n\t\tboxed := g.boxJSValue(value, t)\n\t\tg.currentBB.Instructions = append(g.currentBB.Instructions, &ir.CallInst{Callee: "ts_js_print", Args: []ir.Operand{boxed}, ParamTypes: []types.Type{types.TypeAny}})\n\t\treturn nil\n\t}\n\tvar concrete types.Type\n'''
          if old not in text:
              raise SystemExit('expected lowerConsoleLog union snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/midend/irgen/builtins.go
      - name: Validate fix
        env:
          GOTOOLCHAIN: local
        run: |
          CGO_ENABLED=0 go test ./internal/midend/irgen
          CGO_ENABLED=0 go test ./internal/midend/irgen -run=^$ -fuzz=^FuzzIRGen$ -fuzztime=30s
      - name: Commit fix
        run: |
          rm .github/workflows/irgen-fuzz-hotfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(irgen): print non-union references safely"
          git push origin HEAD:test/reliability-ir-backend-fuzz
