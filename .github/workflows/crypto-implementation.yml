name: Validate Web Crypto implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          gofmt -w internal/frontend/sema/web_crypto.go internal/frontend/sema/calls.go internal/midend/irgen/web_crypto.go internal/midend/irgen/calls.go tests/e2e/wintertc/crypto_test.go
          git diff --exit-code
      - name: Run focused Web Crypto tests
        run: go test ./internal/frontend/sema ./internal/midend/irgen ./tests/e2e/wintertc
      - name: Run full Go test suite
        run: go test ./...
