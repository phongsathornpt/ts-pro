name: Sema Fuzz Hotfix

on:
  push:
    branches:
      - test/reliability-ir-backend-fuzz

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/reliability-ir-backend-fuzz
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Patch SuperExpr guard
        run: |
          python3 -c "from pathlib import Path; p=Path('internal/frontend/sema/expressions.go'); s=p.read_text(); old='\\t\\tbase := c.result.Classes[c.currentClass.BaseName]\\n\\t\\tc.result.Types[e] = base.Constructor\\n\\t\\treturn base.Constructor\\n'; new='\\t\\tbase := c.result.Classes[c.currentClass.BaseName]\\n\\t\\tif base == nil {\\n\\t\\t\\tc.result.Types[e] = types.TypeAny\\n\\t\\t\\treturn types.TypeAny\\n\\t\\t}\\n\\t\\tc.result.Types[e] = base.Constructor\\n\\t\\treturn base.Constructor\\n'; assert old in s; p.write_text(s.replace(old,new,1))"
          gofmt -w internal/frontend/sema/expressions.go
          CGO_ENABLED=0 go test ./internal/frontend/sema
          CGO_ENABLED=0 go test ./internal/frontend/sema -run=^$ -fuzz=^FuzzSema$ -fuzztime=30s
      - name: Commit fix
        run: |
          rm .github/workflows/sema-fuzz-hotfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(sema): guard unresolved super base"
          git push origin HEAD:test/reliability-ir-backend-fuzz
