name: Call Args Fuzz Hotfix

on:
  push:
    branches:
      - test/reliability-ir-backend-fuzz

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/reliability-ir-backend-fuzz
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Preserve call argument semantic metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'internal/frontend/sema/calls.go',
              '''\tcalleeType := c.checkExpr(e.Callee)\n\tfnType, ok := calleeType.(*types.FunctionType)\n\tif !ok {\n\t\tif calleeType.Kind() != types.KindAny {\n\t\t\tc.error(e.Callee.Span(), "TS2349", "This expression is not callable.")\n\t\t}\n\t\tc.result.Types[e] = types.TypeAny\n\t\treturn types.TypeAny\n\t}\n\n\targTypes := make([]types.Type, len(e.Args))\n\tfor i, arg := range e.Args {\n\t\targTypes[i] = c.checkExpr(arg)\n\t}\n''',
              '''\tcalleeType := c.checkExpr(e.Callee)\n\targTypes := make([]types.Type, len(e.Args))\n\tfor i, arg := range e.Args {\n\t\targTypes[i] = c.checkExpr(arg)\n\t}\n\n\tfnType, ok := calleeType.(*types.FunctionType)\n\tif !ok {\n\t\tif calleeType.Kind() != types.KindAny {\n\t\t\tc.error(e.Callee.Span(), "TS2349", "This expression is not callable.")\n\t\t}\n\t\tc.result.Types[e] = types.TypeAny\n\t\treturn types.TypeAny\n\t}\n''',
          )
          replace(
              'internal/midend/irgen/expressions.go',
              '''\tcase *ast.ObjectLit:\n\t\tobjType := g.semanticType(e).(*types.ObjectType)\n\t\toffsets, refMask, shape := g.objectLayout(objType)\n''',
              '''\tcase *ast.ObjectLit:\n\t\tobjType, ok := g.semanticType(e).(*types.ObjectType)\n\t\tif !ok {\n\t\t\treturn g.failExpr("object literal has no lowerable object type")\n\t\t}\n\t\toffsets, refMask, shape := g.objectLayout(objType)\n''',
          )
          replace(
              'internal/midend/irgen/expressions.go',
              '''\t\t\tif prop.Spread {\n\t\t\t\tsourceType := g.semanticType(prop.Value).(*types.ObjectType)\n\t\t\t\tsource := g.lowerExpr(prop.Value)\n''',
              '''\t\t\tif prop.Spread {\n\t\t\t\tsourceType, ok := g.semanticType(prop.Value).(*types.ObjectType)\n\t\t\t\tif !ok {\n\t\t\t\t\treturn g.failExpr("object spread source has no lowerable object type")\n\t\t\t\t}\n\t\t\t\tsource := g.lowerExpr(prop.Value)\n''',
          )
          PY
          gofmt -w internal/frontend/sema/calls.go internal/midend/irgen/expressions.go
      - name: Validate fix
        env:
          GOTOOLCHAIN: local
        run: |
          CGO_ENABLED=0 go test ./internal/frontend/sema ./internal/midend/irgen
          CGO_ENABLED=0 go test ./internal/frontend/sema -run=^$ -fuzz=^FuzzSema$ -fuzztime=30s
          CGO_ENABLED=0 go test ./internal/midend/irgen -run=^$ -fuzz=^FuzzIRGen$ -fuzztime=30s
      - name: Commit fix
        run: |
          rm .github/workflows/call-args-fuzz-hotfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(compiler): preserve call argument type metadata"
          git push origin HEAD:test/reliability-ir-backend-fuzz
