name: Profile WinterTC tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: wintertc-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Measure WinterTC tests
        env:
          TEST_PERF_RAW_STDOUT: "0"
          TEST_PERF_TOP_N: "30"
        run: bash ./scripts/test-performance.sh wintertc
