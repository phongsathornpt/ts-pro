[workspace]
resolver = "3"
members = [
    "crates/tsnative-cli",
    "crates/tsnative-compiler",
    "crates/tsnative-ir",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
